[sd]
SDSYS=/usr/local/sdsys
GRPSIZE=2
NUMUSERS=20
SORTMEM=4096
ERRLOG=50
APILOGIN=1
USRDIR=C:\ProgramData\SD\user_accounts
GRPDIR=C:\ProgramData\SD\group_accounts
# 14 Aug 26 Windows port - the shell OS.EXECUTE and SH use.  PowerShell,
# not bash: an installed SD ships no shell, so the compiled default now
# names PowerShell too and this is here to make it visible and overridable.
# The path must contain no spaces - the parser splits on them.
SH=C:/Windows/System32/WindowsPowerShell/v1.0/powershell.exe -NoProfile -NoLogo
SH1=C:/Windows/System32/WindowsPowerShell/v1.0/powershell.exe -NoProfile -NonInteractive -Command
