# 17 Aug 26 Windows port - THIS FILE IS NOT THE ONE THAT SHIPS, and editing it
# changes nothing about an installed system.  The installed
# C:\ProgramData\SD\sd.conf is written by gplbld/stage.py from the SD_CONF
# string constant near the top of that file; this copy is a development
# leftover that has been kept in step by hand.  A change made here and not
# there is silently absent from every install - which happened on 17 Aug 2026
# with APIPORT, and was caught only by reading the installed file.
#
# Change SD_CONF in gplbld/stage.py.  Mirror it here if you want the two to
# agree; nothing checks that they do.
[sd]
SDSYS=/usr/local/sdsys
GRPSIZE=2
NUMUSERS=20
SORTMEM=4096
ERRLOG=50
APILOGIN=1
# 17 Aug 26 Windows port - APIPORT is the loopback port SD listens on for API
# (SDClient) connections.  IT IS COMMENTED OUT ON PURPOSE, and leaving it that
# way means no port is opened at all.
#
# Set it only if you intend to use the API.  The port is bound to 127.0.0.1
# and never to a network interface - remote clients reach it by forwarding it
# over ssh, "ssh -L 4243:127.0.0.1:4243 <user>@<host>" - but any process
# already on this machine can connect to it, and what stands between such a
# process and your data is the account password APILOGIN=1 demands, plus
# membership of the account's group.  4243 is the number the Linux build uses.
#
# Changing it takes effect when SD is next started, not when a session begins.
#APIPORT=4243
# 21 Aug 26 Windows port - NETDIRS says which directories OUTSIDE ITS OWN
# ACCOUNT a session that arrived over the API may reach.  COMMENTED OUT ON
# PURPOSE: empty is the strict value, and it confines an API session to the
# account it is standing in.  The shipped SDSYS files a normal account needs
# are always reachable without being listed; $cred, gcat, os.users and the
# account register never are.  Semicolon separated - a Windows pathname
# contains a colon.  Sessions at the keyboard and over ssh are not affected.
#NETDIRS=
USRDIR=C:\ProgramData\SD\user_accounts
GRPDIR=C:\ProgramData\SD\group_accounts
# 14 Aug 26 Windows port - the shell OS.EXECUTE and SH use.  PowerShell,
# not bash: an installed SD ships no shell, so the compiled default now
# names PowerShell too and this is here to make it visible and overridable.
# The path must contain no spaces - the parser splits on them.
SH=C:/Windows/System32/WindowsPowerShell/v1.0/powershell.exe -NoProfile -NoLogo
SH1=C:/Windows/System32/WindowsPowerShell/v1.0/powershell.exe -NoProfile -NonInteractive -Command
