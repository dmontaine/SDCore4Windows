filetype: sdbasic

# SD BASIC, for the EDIT and MICRO verbs of SD Core for Windows.
#
# GENERATED FROM THE COMPILER'S OWN TABLES by gplbld/mkbasicsyntax.py, which
# reads sdsys/gpl.bp/bcomp.  Do not hand-edit: regenerate it, or the
# highlighting and the language drift apart.  Counts at generation time are in
# the comment above each rule.
#
# DETECTION IS ON THE WORKING COPY'S NAME, not on the record's.  gpl.bp/edit
# writes a BP record to $hold as "<record>.editing.sdbasic" precisely so that
# this can match; a record edited from any other file gets ".editing" and no
# highlighting, which is the honest answer for a VOC or data record.

detect:
    filename: "\\.sdbasic$"

rules:
    # Statements: BCOMP's "statements", "non.debug.statements" and
    # "restricted.statements" tables - 243 names.
    - statement: "(?i)\\b(REMOVE\\.BREAK\\.HANDLER|SET\\.BREAK\\.HANDLER|SET\\.EXIT\\.STATUS|CONFIGURE\\.FILE|FLUSH\\.DH\\.CACHE|KEYBOARD\\.INPUT|RESTORE\\.SCREEN|SET\\.UNASSIGNED|DELETE\\.COMMON|UNLOAD\\.OBJECT|CLOSE\\.SOCKET|MARK\\.MAPPING|RELEASE\\.LOCK|REMOVE\\.TOKEN|SELECTINDEXV|SELECTRIGHTV|SET\\.TIMEZONE|CLEARCOMMON|CLEARSELECT|CREATE\\.FILE|KEEP\\.SELECT|MATWRITECSV|RECORDLOCKL|RECORDLOCKU|RESET\\.MODES|SELECTINDEX|SELECTLEFTV|SELECTRIGHT|SET\\.TRIGGER|TRANSACTION|BREAKPOINT|CLEARINPUT|DELETELIST|DISINHERIT|DPARSE\\.CSV|FILEUNLOCK|GROUPSTORE|INPUTFIELD|MATREADCSV|OS\\.EXECUTE|RESTRICTED|SELECTLEFT|SET\\.STATUS|SUBROUTINE|AKRELEASE|CLEARDATA|CLEARFILE|CREATE\\.AK|DEBUG\\.OFF|DEBUG\\.SET|DELETE\\.AK|DELETESEQ|FORMLISTV|INPUTNULL|INPUTTRAP|MATWRITEU|MOVELISTV|PRECISION|PROCWRITE|RANDOMIZE|REVREMOVE|SET\\.MODES|SORTCLEAR|WRITEJSON|WRITELIST|WRITESEQF|AKDELETE|AKENABLE|CLOSESEQ|CONTINUE|CSV\\.MODE|DEBUG\\.ON|FILELOCK|FORMLIST|FUNCTION|GETLISTV|INPUTCSV|INPUTERR|MATBUILD|MATPARSE|MATREADL|MATREADU|MATWRITE|MOVELIST|OPENPATH|OPENTEMP|OSDELETE|PRINTCSV|PROCREAD|READJSON|READLIST|READNEXT|ROLLBACK|SAVELIST|SENDMAIL|SETRIGHT|SORTINIT|SSELECTN|SSELECTV|WRITEBLK|WRITECSV|WRITEPKT|WRITESEQ|AKCLEAR|AKWRITE|CONVERT|DELETEU|DISPLAY|EXECUTE|FINDSTR|FOOTING|GETLIST|HEADING|INHERIT|INPUTIF|KEYEDIT|KEYEXIT|KEYTRAP|MATREAD|OPENSEQ|OSWRITE|PHANTOM|PRINTER|PRIVATE|PROGRAM|READBLK|READCSV|READSEQ|RELEASE|SELECTE|SELECTN|SELECTV|SET\\.ARG|SETLEFT|SORTADD|SSELECT|TIMEOUT|WEOFSEQ|WRITEVU|AKREAD|CASING|COMMIT|COMMON|CREATE|DEFFUN|DELETE|DPARSE|EQUATE|ERRMSG|LOCATE|LOGMSG|MODIFY|OSREAD|PROMPT|PUBLIC|READVL|READVU|REMOVE|REPEAT|RETURN|REWIND|SCREEN|SELECT|SETNLS|SETREM|STATUS|TTYSET|UNLOCK|VARSET|WRITEU|WRITEV|ABORT|BEGIN|BREAK|CALLV|CATCH|CHAIN|CLASS|CLEAR|CLOSE|DEBUG|FLUSH|GOSUB|INPUT|LOCAL|NOBUF|PAUSE|PDUMP|PRINT|READL|READU|READV|REDIM|SETPU|SLEEP|THROW|UNTIL|WATCH|WHILE|WRITE|CALL|CASE|COMO|DATA|ECHO|ELSE|EXIT|FILE|FIND|GOTO|HUSH|LOCK|LOOP|NEXT|NULL|OPEN|PAGE|QUIT|READ|SEEK|SEND|STOP|VOID|WAKE|ADD|CRT|DEL|DIM|END|EQU|FOR|GET|INS|MAT|NAP|REM|RUN|SET|TRY|DO|IF|IN|ON)\\b"

    # Reserved words inside statements - 42 names.
    - special: "(?i)\\b(NON\\.TRANSACTIONAL|CURRENT\\.LEVEL|CAPTURING|DELIMITER|OVERWRITE|RETURNING|STACKLIST|CREATING|PASSLIST|READONLY|TRAPPING|NO\\.ECHO|OVERLAY|PANNING|RTNLIST|SETTING|WAITING|APPEND|BEFORE|HIDDEN|LOCKED|REPEAT|SHARED|UPCASE|GOSUB|UNTIL|WHILE|EDIT|ELSE|FROM|GOTO|NEXT|STEP|SYNC|THEN|RAW|AS|BY|DO|IN|ON|TO)\\b"

    # Intrinsic functions - 235 names.
    - identifier: "(?i)\\b(ACCEPT\\.SOCKET\\.CONNECTION|CREATE\\.SERVER\\.SOCKET|GET\\.PORT\\.PARAMS|PRINTER\\.SETTING|SET\\.PORT\\.PARAMS|SET\\.SOCKET\\.MODE|ELEMENT\\.EXISTS|SELECT\\.SOCKET|GET\\.MESSAGES|RECORDLOCKED|WRITE\\.SOCKET|ARG\\.PRESENT|MATCHFIELDS|MVDATE\\.TIME|OPEN\\.SOCKET|READ\\.SOCKET|SAVE\\.SCREEN|SERVER\\.ADDR|SOCKET\\.INFO|CATALOGUED|COLLECTION|FIELDSTORE|MATCHFIELD|SELECTINFO|SUBSTITUTE|SUBSTRINGS|UNASSIGNED|ARG\\.COUNT|ENUMERATE|JVALIDATE|LISTINDEX|OUTERJOIN|ROUNDDOWN|SDDECRYPT|SDENCRYPT|SDRANDKEY|SUMMATION|ASSIGNED|BITRESET|CHECKSUM|CHGPHANT|CSVBUILD|CSVPARSE|DOWNCASE|FCONTROL|FILEINFO|INPUTBLK|JBOOLEAN|KEYREADY|MATCHESS|OS\\.ERROR|SORTDATA|SORTNEXT|SOUNDEXS|SWAPCASE|TERMINFO|TIMEDATE|BINDKEY|BITTEST|COMPARE|CONVERT|CSVOPEN|EXTRACT|INDICES|IS\\.NULL|KEYCODE|MAXIMUM|MINIMUM|MVEPOCH|NUMERIC|OBJINFO|REPLACE|REUSING|ROUNDUP|SOUNDEX|VARTYPE|BITAND|BITNOT|BITSET|BITXOR|CAUGHT|CHANGE|CONFIG|COUNTS|DCOUNT|DELETE|DIGEST|EBCDIC|EXPAND|FIELDS|GETNLS|GETREM|ICONVS|INDEXS|INSERT|JBUILD|JMERGE|JPARSE|JPATCH|KEYINC|KEYINR|LOCATE|MATSTR|MVDATE|MVTIME|OBJECT|OCONVS|QUOTES|REMOVE|RTRANS|SDSALT|SIGNAL|SPACES|SPLICE|SQUOTE|STATUS|SYSMSG|SYSTEM|TRIMBS|TRIMFS|TRIMWS|UPCASE|VSLICE|XBUILD|XPARSE|ALPHA|ASCII|BITOR|CCALL|COUNT|CSVDQ|EPOCH|FIELD|FLOOR|FOLDS|GETPU|ICONV|INDEX|INMAT|ITYPE|JNULL|JPATH|JTYPE|KEYIN|LASTS|LOWER|OCONV|QUOTE|RAISE|REGEX|REUSE|SDKEY|SHIFT|SPACE|TRANS|TRIMB|TRIMF|TRIMS|TRIMW|UMASK|XPATH|ABSS|ACOS|ANDS|ASIN|ATAN|BOOL|CATS|CEIL|CHAR|COL1|COL2|CROP|DATE|FMTS|FOLD|IDIV|LAST|LENS|MODS|NEGS|NOTS|NUMS|RDIV|RMVD|SADD|SCMP|SDIV|SMUL|SORT|SQRT|SSUB|STRS|SUBR|TIME|TRIM|ABS|ARG|COS|DIR|DIV|DTX|ENV|EQS|EXP|FIX|FMT|GES|GTS|IFS|INT|LEN|LES|LTS|MAT|MAX|MIN|MOD|NEG|NES|NOT|NUM|ORS|PWR|REM|RND|SEQ|SIN|STR|SUM|TAN|XTD|LN|NS|NV)\\b"

    # @VARIABLES, @FM and the rest.  One rule: the compiler treats them as
    # names and so does this.
    - constant: "@[A-Za-z][A-Za-z0-9.]*"

    # $INCLUDE, $CATALOG, $INTERNAL - the compiler directives.
    - preproc: "^\\s*\\$[A-Za-z][A-Za-z0-9.]*"

    # Labels: a name at the start of a line followed by a colon.
    - identifier.class: "^\\s*[A-Za-z][A-Za-z0-9.$]*:"

    - constant.number: "\\b[0-9]+(\\.[0-9]+)?\\b"

    - symbol.operator: "([:=<>!+*/-]|#)"

    - constant.string:
        start: "\""
        end: "\""
        skip: "\\\\."

    - constant.string:
        start: "'"
        end: "'"
        skip: "\\\\."

    # A comment is a "*" or "!" in column 1, or ";*" anywhere after code.
    # REM and * are the language's two forms and both are here.
    - comment:
        start: "^\\s*(\\*|!)"
        end: "$"
        rules:
            - todo: "(TODO|FIXME|XXX):?"

    - comment:
        start: ";\\s*\\*"
        end: "$"
        rules:
            - todo: "(TODO|FIXME|XXX):?"

    - comment:
        start: "(?i)^\\s*REM\\b"
        end: "$"
        rules:
            - todo: "(TODO|FIXME|XXX):?"
