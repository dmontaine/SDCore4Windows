filetype: sdbasic

# SD BASIC, for the EDIT and MICRO verbs of SD Core for Windows.
#
# GENERATED FROM THE COMPILER'S OWN TABLES by gplbld/mkbasicsyntax.py, which
# reads sdsys/gpl.bp/BCOMP.  Do not hand-edit: regenerate it, or the
# highlighting and the language drift apart.  Counts at generation time are in
# the comment above each rule.
#
# DETECTION IS ON THE WORKING COPY'S NAME, not on the record's.  gpl.bp/EDIT
# writes a BP record to $hold as "<record>.editing.sdbasic" precisely so that
# this can match; a record edited from any other file gets ".editing" and no
# highlighting, which is the honest answer for a VOC or data record.

detect:
    filename: "\\.sdbasic$"

rules:
    # Statements: BCOMP's "statements", "non.debug.statements" and
    # "restricted.statements" tables - 218 names.
    - statement: "(?i)\\b(REMOVE\\.BREAK\\.HANDLER|SET\\.BREAK\\.HANDLER|SET\\.EXIT\\.STATUS|CONFIGURE\\.FILE|KEYBOARD\\.INPUT|RESTORE\\.SCREEN|SET\\.UNASSIGNED|DELETE\\.COMMON|UNLOAD\\.OBJECT|CLOSE\\.SOCKET|MARK\\.MAPPING|RELEASE\\.LOCK|REMOVE\\.TOKEN|CLEARCOMMON|CLEARSELECT|CREATE\\.FILE|RECORDLOCKL|RECORDLOCKU|RESET\\.MODES|SELECTINDEX|SELECTRIGHT|SET\\.TRIGGER|TRANSACTION|BREAKPOINT|CLEARINPUT|DELETELIST|DISINHERIT|DPARSE\\.CSV|FILEUNLOCK|INPUTCLEAR|INPUTFIELD|MATREADCSV|OS\\.EXECUTE|SELECTLEFT|SET\\.STATUS|SUBROUTINE|AKRELEASE|CLEARDATA|CLEARFILE|CREATE\\.AK|DEBUG\\.OFF|DEBUG\\.SET|DELETE\\.AK|DELETESEQ|DIMENSION|MATWRITEU|PRECISION|PROCWRITE|RANDOMIZE|SET\\.MODES|SORTCLEAR|WRITESEQF|AKDELETE|AKENABLE|CLOSESEQ|CONTINUE|DEBUG\\.ON|FILELOCK|FORMLIST|FUNCTION|INPUTCSV|INPUTERR|MATBUILD|MATPARSE|MATREADL|MATREADU|MATWRITE|OPENPATH|PRINTCSV|PRINTERR|PROCREAD|READLIST|READNEXT|ROLLBACK|SAVELIST|SENDMAIL|SETRIGHT|SORTINIT|WRITEBLK|WRITECSV|WRITEPKT|WRITESEQ|AKCLEAR|AKWRITE|CONVERT|DELETEU|DISPLAY|EXECUTE|FINDSTR|FOOTING|GETLIST|HEADING|INCLUDE|INHERIT|KEYEDIT|KEYEXIT|KEYTRAP|MATREAD|OPENSEQ|PERFORM|PRINTER|PRIVATE|PROGRAM|READBLK|READCSV|READSEQ|RELEASE|SELECTE|SELECTN|SELECTV|SET\\.ARG|SETLEFT|SORTADD|SSELECT|TCLREAD|TIMEOUT|WEOFSEQ|WRITEVU|AKREAD|COMMIT|COMMON|CREATE|DEFFUN|DELETE|DPARSE|EQUATE|ERRMSG|LOCATE|LOGMSG|MODIFY|PROMPT|PUBLIC|READVL|READVU|REMARK|REMOVE|REPEAT|RETURN|REWIND|SELECT|SETNLS|SETREM|STATUS|UNLOCK|VARSET|WRITEU|WRITEV|ABORT|BEGIN|BREAK|CALLV|CHAIN|CLASS|CLEAR|CLOSE|DEBUG|ENTER|FLUSH|GOSUB|INPUT|LOCAL|NOBUF|PAUSE|PRINT|READL|READU|READV|SETPU|SLEEP|UNTIL|WATCH|WHILE|WRITE|CALL|CASE|COMO|DATA|ECHO|ELSE|EXIT|FILE|FIND|GOTO|HUSH|LOCK|LOOP|NEXT|NULL|OPEN|PAGE|QUIT|READ|SEEK|STOP|VOID|WAKE|ADD|COM|CRT|DEL|DIM|END|EQU|FOR|GET|INS|MAT|NAP|REM|RQM|RUN|SET|SUB|DO|GO|IF|IN|ON)\\b"

    # Reserved words inside statements - 37 names.
    - special: "(?i)\\b(CURRENT\\.LEVEL|NOCASEINVERT|CAPTURING|OVERWRITE|RETURNING|PASSLIST|READONLY|TRAPPING|OVERLAY|PANNING|RTNLIST|SETTING|TIMEOUT|WAITING|APPEND|BEFORE|HIDDEN|LOCKED|REPEAT|UPCASE|GOSUB|UNTIL|WHILE|EDIT|ELSE|FROM|GOTO|NEXT|STEP|THEN|FOR|BY|DO|GO|IN|ON|TO)\\b"

    # Intrinsic functions - 176 names.
    - identifier: "(?i)\\b(ACCEPT\\.SOCKET\\.CONNECTION|CREATE\\.SERVER\\.SOCKET|GET\\.PORT\\.PARAMS|PRINTER\\.SETTING|SET\\.PORT\\.PARAMS|SET\\.SOCKET\\.MODE|GET\\.MESSAGES|RECORDLOCKED|WRITE\\.SOCKET|OPEN\\.SOCKET|READ\\.SOCKET|SAVE\\.SCREEN|SERVER\\.ADDR|SOCKET\\.INFO|CATALOGUED|FIELDSTORE|MATCHFIELD|SELECTINFO|SUBSTITUTE|SUBSTRINGS|UNASSIGNED|ARG\\.COUNT|LISTINDEX|OUTERJOIN|SDDECRYPT|SDENCRYPT|SUMMATION|ASSIGNED|BITRESET|CHECKSUM|CHGPHANT|DOWNCASE|FILEINFO|INPUTBLK|KEYREADY|OS\\.ERROR|SENTENCE|SOUNDEXS|SWAPCASE|TERMINFO|TIMEDATE|BINDKEY|BITTEST|COMPARE|CONVERT|EXTRACT|INDICES|KEYCODE|MAXIMUM|MINIMUM|OBJINFO|REPLACE|SOUNDEX|VARTYPE|BITAND|BITNOT|BITSET|BITXOR|CHANGE|CONFIG|COUNTS|DCOUNT|DELETE|DQUOTE|EBCDIC|FIELDS|GETNLS|GETREM|ICONVS|INDEXS|INSERT|KEYINC|KEYINR|LOCATE|OBJECT|OCONVS|REMOVE|RTRANS|SPACES|SPLICE|SQUOTE|STATUS|SYSMSG|SYSTEM|TRIMBS|TRIMFS|UPCASE|VSLICE|ALPHA|ASCII|BITOR|CCALL|COUNT|CSVDQ|FIELD|FOLDS|GETPU|ICONV|INDEX|INMAT|ITYPE|KEYIN|LOWER|OCONV|QUOTE|RAISE|REUSE|SHIFT|SPACE|TRANS|TRIMB|TRIMF|TRIMS|UMASK|XLATE|ABSS|ACOS|ANDS|ASIN|ATAN|CATS|CHAR|COL1|COL2|CROP|DATE|FMTS|FOLD|IDIV|LENS|MODS|NEGS|NOTS|NUMS|RDIV|SQRT|STRS|SUBR|SWAP|TIME|TRIM|ABS|ARG|COS|DIR|DIV|DTX|ENV|EQS|EXP|FMT|GES|GTS|IFS|INT|LEN|LES|LTS|MAX|MIN|MOD|NEG|NES|NOT|NUM|ORS|PWR|REM|RND|SEQ|SIN|STR|SUM|TAN|XTD|LN)\\b"

    # @VARIABLES, @FM and the rest.  One rule: the compiler treats them as
    # names and so does this.
    - constant: "@[A-Za-z][A-Za-z0-9.]*"

    # $INCLUDE, $CATALOG, $INTERNAL - the compiler directives.
    - preproc: "^\\s*\\$[A-Za-z][A-Za-z0-9.]*"

    # Labels: a name at the start of a line followed by a colon.
    - identifier.class: "^\\s*[A-Za-z][A-Za-z0-9.$]*:"

    - constant.number: "\\b[0-9]+(\\.[0-9]+)?\\b"

    - symbol.operator: "([:=<>!+*/-]|#)"

    - constant.string:
        start: "\""
        end: "\""
        skip: "\\\\."

    - constant.string:
        start: "'"
        end: "'"
        skip: "\\\\."

    # A comment is a "*" or "!" in column 1, or ";*" anywhere after code.
    # REM and * are the language's two forms and both are here.
    - comment:
        start: "^\\s*(\\*|!)"
        end: "$"
        rules:
            - todo: "(TODO|FIXME|XXX):?"

    - comment:
        start: ";\\s*\\*"
        end: "$"
        rules:
            - todo: "(TODO|FIXME|XXX):?"

    - comment:
        start: "(?i)^\\s*REM\\b"
        end: "$"
        rules:
            - todo: "(TODO|FIXME|XXX):?"
